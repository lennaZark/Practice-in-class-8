name: Hello World

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Display Hello World 1
        run: echo "Hello World 1"

  goodbye:
    runs-on: ubuntu-latest
    needs: hello  # This makes sure hello runs FIRST
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Display Hello World 2
        run: echo "Hello World 2"

  final:
    runs-on: ubuntu-latest
    needs: [hello, goodbye]  # Both jobs need to finish before this
    steps:
      - name: Green Check Spell
        run: echo "Lenna to Hogwarts... Mission Completed!"